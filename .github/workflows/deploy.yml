name: Deploy

# Déploiement manuel d'une version déjà publiée par la CI vers Azure Container Apps.
# Il faut que l'infrastructure existe (terraform apply) ; sinon le job échoue proprement.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag des images à déployer (ex. sha-<commit complet>)"
        required: true
        type: string

permissions:
  id-token: write # nécessaire à la connexion OIDC à Azure
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-proposalrag-dev
  SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environnement GitHub avec relecteur obligatoire : l'approbation se fait ici.
    environment: production
    steps:
      - name: Diagnose OIDC (temporary)
        env:
          CID: ${{ secrets.AZURE_CLIENT_ID }}
          TID: ${{ secrets.AZURE_TENANT_ID }}
          SID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Longueurs attendues : 36 caractères (un UUID). Autre valeur = espace ou retour à la ligne en trop.
          echo "client-id length=${#CID} tenant-id length=${#TID} subscription-id length=${#SID}"
          echo "client-id empty? $([ -z "$CID" ] && echo YES || echo no)"
          # Identité que GitHub présente à Azure (ni secret ni jeton affichés).
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "
          import sys,json,base64
          p=sys.stdin.read().split('.')[1]
          c=json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))
          print({k:c.get(k) for k in ('sub','aud','iss')})"

      - name: Log in to Azure (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # L'identité n'a de droits que sur un groupe de ressources, pas sur l'abonnement entier.
          allow-no-subscriptions: true

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy backend
        run: |
          az containerapp update \
            --subscription "$SUBSCRIPTION_ID" \
            --name ca-backend \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}-backend:${{ inputs.image_tag }}"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --subscription "$SUBSCRIPTION_ID" \
            --name ca-frontend \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}-frontend:${{ inputs.image_tag }}"

      - name: Show deployed images
        run: |
          for app in ca-backend ca-frontend; do
            az containerapp show --subscription "$SUBSCRIPTION_ID" \
            --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query "{app:name, image:properties.template.containers[0].image, etat:properties.provisioningState}" -o table
          done
