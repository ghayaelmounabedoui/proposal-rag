name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # PyTorch CPU : évite de télécharger les bibliothèques CUDA.
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Les tests utilisent des faux modèles : aucune clé ni accès réseau requis.
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          load: true
          tags: proposal-rag-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: proposal-rag-frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy cherche des failles connues dans les paquets de chaque image.
      # Version épinglée par son empreinte : l'outil ne peut pas changer à notre insu.
      - name: Scan images for vulnerabilities (report)
        env:
          TRIVY: aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
        run: |
          for img in backend frontend; do
            echo "::group::Trivy - $img (HIGH et CRITICAL, correctif disponible)"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image               --severity HIGH,CRITICAL --ignore-unfixed --format table "proposal-rag-$img:scan"               | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      # Garde-fou : passer SCAN_EXIT_CODE à "1" fait échouer la CI s'il reste une faille CRITIQUE corrigeable.
      - name: Scan images for vulnerabilities (gate)
        env:
          TRIVY: aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          SCAN_EXIT_CODE: "0"
        run: |
          for img in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image               --severity CRITICAL --ignore-unfixed --exit-code "$SCAN_EXIT_CODE" --quiet "proposal-rag-$img:scan"
          done

  # Publie les images dans GHCR (registre de GitHub), uniquement après un merge sur main.
  # Chaque image est taguée avec le SHA du commit : on sait exactement ce qui tourne
  # et on peut revenir à une version précédente.
  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom d'image en minuscules.
      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
