services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: proposal-rag-backend

    # Exposé uniquement en local : placer un reverse proxy HTTPS devant en production.
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      # Vide = API non protégée (développement). À définir en production.
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app/src

    volumes:
      - ./var/chroma:/app/var/chroma
      - ./data/raw:/app/data/raw

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: proposal-rag-frontend

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      PROPOSAL_RAG_API_URL: http://backend:8000
      PROPOSAL_RAG_API_KEY: ${API_KEY:-}

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
