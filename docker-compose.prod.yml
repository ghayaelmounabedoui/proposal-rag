# Production : seul Caddy (le "portier HTTPS") est visible depuis Internet.
# backend et frontend n'ont aucun port publié : ils ne se parlent qu'à l'intérieur de Docker.
#
# Lancer :  docker compose -f docker-compose.prod.yml up -d --build

services:
  backend:
    # BACKEND_IMAGE : image publiée par la CI (ghcr.io/...-backend:sha-...).
    # Sans cette variable, l'image est construite localement comme avant.
    image: ${BACKEND_IMAGE:-proposal-rag-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      # Obligatoire en production : sans clé, n'importe quel conteneur du réseau peut appeler l'API.
      API_KEY: ${API_KEY:?API_KEY is required in production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app/src

    volumes:
      - ./var/chroma:/app/var/chroma
      - ./data/raw:/app/data/raw

    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-proposal-rag-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend

    environment:
      PROPOSAL_RAG_API_URL: http://backend:8000
      PROPOSAL_RAG_API_KEY: ${API_KEY:?API_KEY is required in production}

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  caddy:
    image: caddy:2

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (ex. rfp.mondomaine.com)}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Conserve les certificats HTTPS entre les redémarrages.
      - caddy_data:/data

    depends_on:
      frontend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  caddy_data:
