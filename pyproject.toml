[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proposal-rag"
version = "0.2.0"
description = "RAG assistant for evidence-based RFP responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.2,<2",
    "pymupdf>=1.24,<2",
    "sentence-transformers>=3.4,<6",
    "chromadb>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "groq>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
frontend = ["streamlit>=1.40,<2", "requests>=2.31,<3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F = erreurs réelles (imports inutilisés, noms indéfinis...), E9 = erreurs de syntaxe.
select = ["F", "E9"]
